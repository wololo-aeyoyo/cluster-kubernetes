apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: postgres/data/pg
        property: data.POSTGRES_DB
    - secretKey: POSTGRES_NON_ROOT_PASSWORD
      remoteRef:
        key: postgres/data/pg
        property: data.POSTGRES_NON_ROOT_PASSWORD
    - secretKey: POSTGRES_NON_ROOT_USER
      remoteRef:
        key: postgres/data/pg
        property: data.POSTGRES_NON_ROOT_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres/data/pg
        property: data.POSTGRES_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres/data/pg
        property: data.POSTGRES_USER
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secret
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: n8n-secret
    creationPolicy: Owner
  data:
    - secretKey: N8N_RUNNERS_AUTH_TOKEN
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.N8N_RUNNERS_AUTH_TOKEN
    - secretKey: N8N_INSTANCE_AI_MODEL_API_KEY
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.N8N_INSTANCE_AI_MODEL_API_KEY
    - secretKey: N8N_INSTANCE_AI_SANDBOX_API_KEY
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.N8N_INSTANCE_AI_SANDBOX_API_KEY
    - secretKey: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.SANDBOX_API_RUNNER_REGISTRATION_TOKEN
    - secretKey: SANDBOX_API_RUNNER_API_KEY
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.SANDBOX_API_RUNNER_API_KEY
---
# Kept separate from n8n-secret on purpose: if SEARXNG_SECRET is missing in
# Vault, only this secret fails to sync — the n8n deployment's own secret is
# unaffected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: searxng-secret
    creationPolicy: Owner
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: n8n-secret/data/secrets
        property: data.SEARXNG_SECRET
