apiVersion: v1
kind: Service
metadata:
  name: minecraft-tailscale
  namespace: minecraft
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "minecraft"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/instance: minecraft-minecraft-deployment
  ports:
    - name: minecraft
      # Players still connect on the default MC port, but the container binds
      # servicePort (25566) because the chart drives SERVER_PORT from it.
      # Targeting the named port keeps this correct if that value changes.
      port: 25565
      targetPort: minecraft
      protocol: TCP
