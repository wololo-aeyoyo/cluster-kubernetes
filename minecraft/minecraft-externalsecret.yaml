# CurseForge API key for the AUTO_CURSEFORGE server type. Without it the
# container cannot resolve or download the modpack and exits on boot.
# Obtain a key from https://console.curseforge.com/ (Settings -> API Keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-curseforge-secret
  namespace: minecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: minecraft-curseforge-secret
    creationPolicy: Owner
  data:
    # Key name must stay cf-api-key: it is what the chart's
    # autoCurseForge.apiKey.secretKey points at.
    - secretKey: cf-api-key
      remoteRef:
        key: minecraft/data/curseforge
        property: data.CF_API_KEY
