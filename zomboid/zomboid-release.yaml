apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zomboid-deployment
  namespace: zomboid
spec:
  targetNamespace: zomboid
  chart:
    spec:
      chart: zomboid-dedicated-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: zomboid-repo
      version: 1.0.0
  interval: 1m0s
  valuesFrom:
    - kind: ConfigMap
      name: zomboid-configmap
      valuesKey: values.yaml
    - kind: Secret
      name: zomboid-secret
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: zomboid-dedicated-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: zomboid-dedicated-server
              spec:
                template:
                  spec:
                    # Kanpachi's shutdown needs up to 45s, and cutting it short
                    # leaves its nftables rules applied on the node. The default
                    # 30 is not enough; upstream's compose asks for 60.
                    terminationGracePeriodSeconds: 60
                    containers:
                      - name: zomboid-dedicated-server
                        # -nosteam has to be injected rather than passed. The
                        # image's entrypoint builds LAUNCH_ARGS itself and
                        # forwards nothing from argv, its CMD is the entrypoint
                        # (so a plain args: would replace it, not extend the
                        # game's flags), and the chart exposes no extraArgs. So
                        # the script is edited on the way past, in /tmp; the
                        # image and the PVCs stay untouched. If a future image
                        # changes that array the sed stops matching, which is
                        # why the grep is here: fail loudly rather than boot a
                        # Steam-enabled server nobody can join.
                        command: ["/bin/bash", "-c"]
                        args:
                          - |
                            set -euo pipefail
                            cp /home/steam/entrypoint.sh /tmp/entrypoint.sh
                            sed -i 's|^  -cachedir=|  -nosteam\n  -cachedir=|' /tmp/entrypoint.sh
                            grep -q -- -nosteam /tmp/entrypoint.sh || {
                              echo "ERROR: -nosteam was not injected; the image's entrypoint changed shape" >&2
                              exit 1
                            }
                            exec /tmp/entrypoint.sh
                        env:
                          # 0.0.0.0, and NOT the pod's IP. Sharing a network
                          # namespace is not enough: Kanpachi delivers real
                          # packets to its own address on kanpachi0, so a server
                          # bound to the pod's address never sees them and the
                          # kernel answers "udp port 16261 unreachable" to every
                          # guest while the tunnel, the ports and every screen
                          # look perfect. Tailscale hides this because its
                          # sidecar terminates traffic and forwards it to the pod
                          # IP; Kanpachi does not proxy. Measured 2026-08-19 with
                          # a drop capture on a guest.
                          - name: SERVER_IP
                            value: "0.0.0.0"
                    # A native sidecar (k8s >= 1.29): it starts before the game
                    # and is torn down after it, and the chart's Deployment
                    # template has no extraContainers hook, so post-render is the
                    # only way in. Containers in a pod share one network
                    # namespace, so the TUN adapter this creates is visible to
                    # Zomboid as if Kanpachi were installed alongside it, while
                    # the upstream image stays untouched. This is the k8s form of
                    # upstream's docker/templates/compose.sidecar.yml.
                    initContainers:
                      - name: kanpachi
                        # Upstream's own image. Only whole versions are
                        # published, so it is pinned rather than :latest.
                        #
                        # 0.6.6 or newer: it says whether the game's server is
                        # actually listening, and where. If the bind above ever
                        # goes back to a single address, this version sends the
                        # room's traffic there anyway and says so, instead of
                        # leaving a room that looks healthy and is not.
                        image: ghcr.io/alvarogabrielgomez/kanpachi:0.6.6
                        restartPolicy: Always
                        env:
                          # The only name the guests get to read. Without it the
                          # room is named after the pod's hostname.
                          - name: KANPACHI_ROOM_NAME
                            value: "Merwebo Zomboid"
                          # From the catalogue, and it brings the game's ports
                          # with it. Excludes KANPACHI_PORTS_*.
                          - name: KANPACHI_GAME
                            value: "project-zomboid"
                        # KANPACHI_SEED, and KANPACHI_SEED_PASSWORD if the
                        # registry asks for one.
                        envFrom:
                          - secretRef:
                              name: kanpachi-secret
                        securityContext:
                          # The chart sets runAsUser 10000 at pod level; this
                          # container-level override wins for the sidecar alone.
                          # Its allowPrivilegeEscalation: false is set on the
                          # Zomboid container, so it does not constrain us.
                          runAsUser: 0
                          runAsGroup: 0
                          allowPrivilegeEscalation: true
                          capabilities:
                            # NET_ADMIN is the one the entrypoint checks for:
                            # the daemon builds a virtual adapter and writes
                            # nftables rules.
                            add: ["NET_ADMIN", "NET_RAW"]
                        volumeMounts:
                          # The room lives here: identity.key, the saved room,
                          # the game profiles and the log.
                          - name: kanpachi-state
                            mountPath: /var/lib/kanpachi
                          # The daemon's control socket, api.sock.
                          - name: kanpachi-run
                            mountPath: /run/kanpachi
                          - name: dev-net-tun
                            mountPath: /dev/net/tun
                    volumes:
                      - name: kanpachi-state
                        persistentVolumeClaim:
                          claimName: kanpachi-state
                      - name: kanpachi-run
                        emptyDir:
                          medium: Memory
                      - name: dev-net-tun
                        hostPath:
                          path: /dev/net/tun
                          type: CharDevice
                    nodeSelector:
                      kubernetes.io/arch: amd64