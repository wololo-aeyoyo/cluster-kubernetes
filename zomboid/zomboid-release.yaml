apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zomboid-deployment
  namespace: zomboid
spec:
  targetNamespace: zomboid
  chart:
    spec:
      chart: zomboid-dedicated-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: zomboid-repo
      version: 1.0.0
  interval: 1m0s
  valuesFrom:
    - kind: ConfigMap
      name: zomboid-configmap
      valuesKey: values.yaml
    - kind: Secret
      name: zomboid-secret
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: zomboid-dedicated-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: zomboid-dedicated-server
              spec:
                template:
                  spec:
                    containers:
                      - name: zomboid-dedicated-server
                        env:
                          - name: SERVER_IP
                            valueFrom:
                              fieldRef:
                                apiVersion: v1
                                fieldPath: status.podIP
                    nodeSelector:
                      kubernetes.io/arch: amd64
