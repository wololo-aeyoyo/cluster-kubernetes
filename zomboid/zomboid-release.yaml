apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zomboid-deployment
  namespace: zomboid
spec:
  targetNamespace: zomboid
  chart:
    spec:
      chart: zomboid-dedicated-server
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: zomboid-repo
      version: 1.0.0
  interval: 1m0s
  valuesFrom:
    - kind: ConfigMap
      name: zomboid-configmap
      valuesKey: values.yaml
    - kind: Secret
      name: zomboid-secret
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: zomboid-dedicated-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: zomboid-dedicated-server
              spec:
                template:
                  spec:
                    # The pod shares the node's network namespace, which is what
                    # buys a direct path instead of a relayed one. Without it a
                    # pod leaves through the CNI with address translation in the
                    # way, and from outside that reads as symmetric NAT: the
                    # engine detects it and routes the room through the seed,
                    # which works and is slower. Nothing inside the pod can
                    # change that, because the translation happens a layer down.
                    #
                    # The price, and it is deliberate: this pod's ports ARE the
                    # node's ports. 16261-16262 and 8766-8767 are claimed on the
                    # node itself, so nothing else on it may hold them. Checked
                    # across the cluster: what else takes ports on a node is
                    # node-exporter on 9100 and metallb's speaker on 7472 and
                    # 7946, and neither collides.
                    #
                    # This depends on the chart rendering `strategy: Recreate`,
                    # which it does today. A rolling update cannot work here: a
                    # surge pod would have to bind ports the old pod still
                    # holds, and it would sit there until it timed out.
                    #
                    # And two consequences worth knowing before changing
                    # anything here. Kanpachi's nftables rules land in the
                    # node's namespace rather than the pod's, scoped to its own
                    # tunnel interface and the room's subnet. And the base
                    # quarantine MUST stay off, which is the image's default and
                    # is why KANPACHI_QUARANTINE is absent below: its scope is
                    # the whole network namespace, and here that namespace
                    # belongs to the node.
                    hostNetwork: true
                    # Required with hostNetwork for anything in the pod to
                    # resolve cluster services; without it both containers read
                    # the node's resolv.conf.
                    dnsPolicy: ClusterFirstWithHostNet
                    # Kanpachi's shutdown needs up to 45s, and cutting it short
                    # leaves its nftables rules applied on the node. The default
                    # 30 is not enough; upstream's compose asks for 60.
                    terminationGracePeriodSeconds: 60
                    containers:
                      - name: zomboid-dedicated-server
                        # No -nosteam, and no entrypoint rewrite to inject it.
                        # A Steam client will not talk to a -nosteam server, and
                        # everybody joining this room owns the game on Steam.
                        # Measured on the same setup: with it, the client said
                        # "server failed to respond" while a raw RakNet probe
                        # from a socket got OPEN_CONNECTION_REPLY_1 back, so the
                        # server was up and the game refused it. Without it, the
                        # client connects.
                        #
                        # A Steam server needs 8766-8767 as well as 16261-16262.
                        # Kanpachi opens both ranges for this profile.
                        env:
                          # The image REJECTS this value on purpose. Its
                          # entrypoint reads:
                          #
                          #   if [ "${SERVER_IP}" == "0.0.0.0" ] || [ -z ... ]
                          #     SERVER_IP=$(hostname -i)
                          #
                          # so the server binds to the pod's address either way,
                          # and unsetting this changes nothing but the wording of
                          # the warning. Kanpachi is what makes the room reach it:
                          # in a container it sends the room's traffic to wherever
                          # the game actually listens, in the profile's ports, and
                          # `kanpachi status` names the address. It is kept here
                          # so a future image that honours 0.0.0.0 gets the better
                          # bind for free.
                          - name: SERVER_IP
                            value: "0.0.0.0"
                    # A native sidecar (k8s >= 1.29): it starts before the game
                    # and is torn down after it, and the chart's Deployment
                    # template has no extraContainers hook, so post-render is the
                    # only way in. Containers in a pod share one network
                    # namespace, so the TUN adapter this creates is visible to
                    # Zomboid as if Kanpachi were installed alongside it, while
                    # the upstream image stays untouched. This is the k8s form of
                    # upstream's docker/templates/compose.sidecar.yml.
                    initContainers:
                      - name: kanpachi
                        # Upstream's own image. Only whole versions are
                        # published, so it is pinned rather than :latest.
                        #
                        # 0.6.8 or newer, and 0.6.6 does not work here. On 0.6.6
                        # the host only recalculated its firewall rules from the
                        # engine's `peers_changed` event, and that event does not
                        # arrive: a guest holds a credential and an open control
                        # channel, the host still counts one member, and every
                        # packet for the game dies at the host's own gate. Fixed
                        # in 0.6.7.
                        #
                        # 0.6.8 adds the rest of what this deployment needs: the
                        # redirect travels to the guests instead of only being
                        # applied here, a change in it is announced at once
                        # rather than up to two minutes later, and the Zomboid
                        # profile carries Steam's ports.
                        #
                        # 0.7.0 is what this pod runs on, and 0.6.8 admitted
                        # nobody here for thirty-three hours while Kubernetes
                        # reported it Ready. Who may reach the control port was
                        # computed from the engine's mesh table, which says who
                        # is alive rather than who is a member: it arrives late,
                        # it arrives before the route carries an address, and it
                        # has no event at all for somebody who drops off. The
                        # gate was applied four seconds before the guest showed
                        # up in the mesh and nothing re-read it, so every SYN
                        # after that died in the gate's drop. 0.7.0 decides
                        # membership from the host's credential book, re-reads
                        # the mesh once it has converged, and logs every room
                        # state change to stdout, which is the only log
                        # `kubectl logs` shows.
                        #
                        # `latest` and not a number, so a restart picks up
                        # the newest release without a commit here. The
                        # release workflow pushes `:latest` next to the
                        # version tag on every release that is not a
                        # prerelease, and `Always` is what makes a restart
                        # go and look: without it the kubelet keeps serving
                        # the copy it already has and `latest` never moves.
                        image: ghcr.io/alvarogabrielgomez/kanpachi:latest
                        imagePullPolicy: Always
                        restartPolicy: Always
                        env:
                          # The only name the guests get to read. Without it the
                          # room is named after the pod's hostname.
                          - name: KANPACHI_ROOM_NAME
                            value: "Merwebo Zomboid"
                          # From the catalogue, and it brings the game's ports
                          # with it. Excludes KANPACHI_PORTS_*.
                          - name: KANPACHI_GAME
                            value: "project-zomboid"
                        # KANPACHI_SEED, and KANPACHI_SEED_PASSWORD if the
                        # registry asks for one.
                        envFrom:
                          - secretRef:
                              name: kanpachi-secret
                        securityContext:
                          # The chart sets runAsUser 10000 at pod level; this
                          # container-level override wins for the sidecar alone.
                          # Its allowPrivilegeEscalation: false is set on the
                          # Zomboid container, so it does not constrain us.
                          runAsUser: 0
                          runAsGroup: 0
                          allowPrivilegeEscalation: true
                          capabilities:
                            # NET_ADMIN is the one the entrypoint checks for:
                            # the daemon builds a virtual adapter and writes
                            # nftables rules.
                            add: ["NET_ADMIN", "NET_RAW"]
                        volumeMounts:
                          # The room lives here: identity.key, the saved room,
                          # the game profiles and the log.
                          - name: kanpachi-state
                            mountPath: /var/lib/kanpachi
                          # The daemon's control socket, api.sock.
                          - name: kanpachi-run
                            mountPath: /run/kanpachi
                          - name: dev-net-tun
                            mountPath: /dev/net/tun
                    volumes:
                      - name: kanpachi-state
                        persistentVolumeClaim:
                          claimName: kanpachi-state
                      - name: kanpachi-run
                        emptyDir:
                          medium: Memory
                      - name: dev-net-tun
                        hostPath:
                          path: /dev/net/tun
                          type: CharDevice
                    nodeSelector:
                      kubernetes.io/arch: amd64