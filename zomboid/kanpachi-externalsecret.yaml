apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanpachi-secret
  namespace: zomboid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: kanpachi-secret
    creationPolicy: Owner
  data:
    # The registry this machine opens rooms on. There is no default seed, so
    # without this the daemon cannot host at all.
    - secretKey: KANPACHI_SEED
      remoteRef:
        key: zomboid/data/kanpachi
        property: data.KANPACHI_SEED
    # Only needed if the seed asks for a password to host. Joining never does.
    - secretKey: KANPACHI_SEED_PASSWORD
      remoteRef:
        key: zomboid/data/kanpachi
        property: data.KANPACHI_SEED_PASSWORD
