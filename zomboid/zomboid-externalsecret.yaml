apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zomboid-secret
  namespace: zomboid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-access
    kind: ClusterSecretStore
  target:
    name: zomboid-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        values.yaml: |
          config:
            adminPassword: "{{ .ADMIN_PASSWORD }}"
            rconPassword: "{{ .RCON_PASSWORD }}"
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: zomboid/data/secrets
        property: data.ADMIN_PASSWORD
    - secretKey: RCON_PASSWORD
      remoteRef:
        key: zomboid/data/secrets
        property: data.RCON_PASSWORD
